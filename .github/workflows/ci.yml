name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: novaport
          POSTGRES_PASSWORD: novaport
          POSTGRES_DB: novaport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novaport -d novaport_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOVAPORT_TEST_DATABASE_URL: postgresql+asyncpg://novaport:novaport@localhost:5432/novaport_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install sops
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/sops" \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/bin/sops" \
            | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/sops"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: novaport
          POSTGRES_PASSWORD: novaport
          POSTGRES_DB: novaport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novaport -d novaport_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOVAPORT_TEST_DATABASE_URL: postgresql+asyncpg://novaport:novaport@localhost:5432/novaport_test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: novaport:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install sops
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/sops" \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/bin/sops" \
            | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/sops"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Start a test Swarm
        run: NOVAPORT_SWARM_AGENT_IMAGE=novaport:dev tests/integration/swarm.sh up >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run pytest tests/integration
      - name: Stop the test Swarm
        if: always()
        run: tests/integration/swarm.sh down
