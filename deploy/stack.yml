# Novaport on Docker Swarm.
#
# Create the secrets once (on a manager):
#
#   openssl rand -hex 32 | docker secret create novaport_agent_token -
#   docker run --rm ghcr.io/denniedev/novaport generate-key | docker secret create novaport_secret_key -
#   DB_PASSWORD=$(openssl rand -hex 24)
#   printf %s "$DB_PASSWORD" | docker secret create novaport_postgres_password -
#   printf %s "postgresql+asyncpg://novaport:$DB_PASSWORD@db:5432/novaport" \
#     | docker secret create novaport_database_url -
#   printf %s 'choose-a-long-admin-password' | docker secret create novaport_initial_admin_password -
#   docker run --rm ghcr.io/denniedev/novaport generate-age-key | tail -1 \
#     | docker secret create novaport_age_key -
#
# Then deploy:
#
#   docker stack deploy -c stack.yml novaport
#
# Novaport listens on port 8000. Put it behind a TLS-terminating proxy for anything but a test.

services:
  server:
    image: ${NOVAPORT_IMAGE:-ghcr.io/denniedev/novaport:latest}
    command: server
    environment:
      NOVAPORT_AGENT_DNS: tasks.agent
    secrets:
      - novaport_database_url
      - novaport_agent_token
      - novaport_secret_key
      - novaport_initial_admin_password
      - novaport_age_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/var/lib/novaport
    ports:
      - "8000:8000"
    networks: [default, agents]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')
      interval: 15s
      timeout: 5s
      start_period: 30s

  agent:
    image: ${NOVAPORT_IMAGE:-ghcr.io/denniedev/novaport:latest}
    command: agent
    secrets:
      - novaport_agent_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
    networks: [agents]
    deploy:
      mode: global

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: novaport
      POSTGRES_DB: novaport
      POSTGRES_PASSWORD_FILE: /run/secrets/novaport_postgres_password
    secrets:
      - novaport_postgres_password
    volumes:
      - db:/var/lib/postgresql
    networks: [default]
    deploy:
      placement:
        # With more than one manager, pin the database to one node with a label instead.
        constraints: [node.role == manager]

networks:
  default:
    driver: overlay
  agents:
    driver: overlay
    driver_opts:
      encrypted: "true"

volumes:
  data:
  db:

secrets:
  novaport_database_url:
    external: true
  novaport_agent_token:
    external: true
  novaport_secret_key:
    external: true
  novaport_postgres_password:
    external: true
  novaport_initial_admin_password:
    external: true
  novaport_age_key:
    external: true
