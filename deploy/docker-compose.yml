# Swarmer on Docker Swarm, behind Traefik.
#
# Copy .env.example to .env next to this file and fill it in, create the data directories, then
# deploy from this directory:
#
#   mkdir -p /data/swarmer/data /data/swarmer/postgres
#   SWARMER_IMAGE=ghcr.io/denniedev/swarmer:0.1.0 docker stack deploy -c docker-compose.yml swarmer
#
# Traefik needs the swarm provider (v3) and an attachable overlay network named traefik:
#
#   docker network create -d overlay --attachable traefik

services:

  server:
    image: ${SWARMER_IMAGE:-ghcr.io/denniedev/swarmer:latest}
    command: server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        # The old server keeps running until the new one is healthy, so a deploy of this
        # stack started from Swarmer itself completes. See docs/operations.md.
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik
        - traefik.http.routers.swarmer.rule=Host(`swarmer.example.com`)
        - traefik.http.routers.swarmer.entrypoints=websecure
        - traefik.http.routers.swarmer.tls=true
        - traefik.http.services.swarmer.loadbalancer.server.port=8000
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/swarmer/data:/var/lib/swarmer
    networks:
      - default
      - agents
      - traefik

  agent:
    image: ${SWARMER_IMAGE:-ghcr.io/denniedev/swarmer:latest}
    command: agent
    deploy:
      mode: global
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
    networks:
      - agents

  postgres:
    image: postgres:18-alpine
    deploy:
      placement:
        # With more than one manager, pin the database to one node with a label instead.
        constraints: [node.role == manager]
    env_file: .env
    environment:
      POSTGRES_USER: swarmer
      POSTGRES_DB: swarmer
    volumes:
      - /data/swarmer/postgres:/var/lib/postgresql
    networks:
      - default

networks:
  default:
    driver: overlay
  agents:
    driver: overlay
    driver_opts:
      encrypted: "true"
  traefik:
    external: true
